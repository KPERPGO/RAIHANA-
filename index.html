<script>
/* loading screen: the ring moves smoothly toward how much has loaded, then fades out once everything is ready */
window.BOOT = (function(){
  let shown = 0, target = 8, done = false, raf = 0; const C = 326.73, t0 = Date.now();
  const arc = document.getElementById("bootArc"), pct = document.getElementById("bootPct"), el = document.getElementById("boot");
  function draw(){ shown += (target - shown) * 0.18 + (shown < target ? 0.4 : 0); if (shown > target) shown = target;
    arc.setAttribute("stroke-dashoffset", (C * (1 - shown / 100)).toFixed(2)); const n = Math.round(shown); pct.textContent = n + "%"; el.setAttribute("aria-valuenow", n);
    if (shown < target) raf = requestAnimationFrame(draw); else if (done){ el.classList.add("out"); setTimeout(() => el.remove(), 320); } else raf = 0; }
  const go = () => { if (!raf) raf = requestAnimationFrame(draw); };
  setTimeout(() => { if (!done) api.finish(); }, 12000); // never block the app if something is slow
  const api = { set(p){ if (done) return; target = Math.max(target, Math.min(99, p)); go(); }, finish(){ if (done) return; done = true; target = 100; go(); }, get done(){ return done; }, ms: () => Date.now() - t0 };
  const creep = setInterval(() => { if (done) return clearInterval(creep); if (target < 45) api.set(target + 1); }, 90); // keeps moving while the first files download
  go(); return api;
})();

<script>
/* Raihana ERP device runtime.
   On claude.ai the page uses Claude's own storage. Installed on a phone or computer it uses this:
   a local database on the device (works with no internet), photo storage, file downloads,
   and optional cloud sync to the pharmacy's own Supabase project. */
(function(){
  if (window.claude && window.claude.use){ window.ERP_MODE = "claude"; return; }
  window.ERP_MODE = "device";
  const DBNAME = "raihana-erp";
  let dbp = null;
  const idb = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DBNAME, 1);
    r.onupgradeneeded = () => { r.result.createObjectStore("docs"); r.result.createObjectStore("blobs"); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  }));
  const tx = (store, mode, fn) => idb().then(d => new Promise((res, rej) => { const t = d.transaction(store, mode); const out = fn(t.objectStore(store)); t.oncomplete = () => res(out && out.result !== undefined ? out.result : out); t.onerror = () => rej(t.error); }));
  const cache = new Map(), subs = new Map();
  const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch { return d; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
  const loaded = idb().then(d => new Promise(res => {
    const rq = d.transaction("docs").objectStore("docs").openCursor();
    rq.onsuccess = () => { const c = rq.result; if (c){ cache.set(c.key, c.value); c.continue(); } else res(); };
    rq.onerror = () => res();
  })).catch(() => {});
  const strip = v => { const o = {...v}; delete o.__ver; return o; };
  const clean = v => { const o = {...v}; delete o.__deleted; delete o.__rev; delete o.__ver; return o; };
  const snap = coll => ({docs: [...cache].filter(([p, v]) => p.split("/")[0] === coll && !v.__deleted).map(([p, v]) => ({id: p.split("/").slice(1).join("/"), data: () => clean(v)}))});
  const emit = coll => (subs.get(coll) || []).forEach(cb => { try { cb(snap(coll)); } catch(e){ console.error(e); } });
  let dirty = new Set(lsGet("erp.dirty", []));
  async function put(path, val, fromSync){
    cache.set(path, val);
    try { await tx("docs", "readwrite", s => s.put(val, path)); }
    catch(e){ throw Object.assign(new Error("Storage is full or blocked on this device."), {code: "quota_exceeded"}); }
    if (!fromSync){ dirty.add(path); lsSet("erp.dirty", [...dirty]); SYNC.soon(); }
    emit(path.split("/")[0]);
  }
  const db = {
    doc(path){ return {
      set: async data => { await loaded; return put(path, {...data, __rev: Date.now(), __ver: cache.get(path)?.__ver || 0}); },
      update: async data => { await loaded; const cur = cache.get(path); if (!cur || cur.__deleted) throw Object.assign(new Error("not found"), {code: "not_found"}); return put(path, {...cur, ...data, __rev: Date.now(), __ver: cur.__ver || 0}); },
      delete: async () => { await loaded; return put(path, {__deleted: true, __rev: Date.now(), __ver: cache.get(path)?.__ver || 0}); },
      get: async () => { await loaded; const v = cache.get(path); return {exists: !!v && !v.__deleted, id: path.split("/").pop(), data: () => v ? clean(v) : undefined}; }
    }; },
    collection(coll){ return { onSnapshot(cb, err){
      if (!subs.has(coll)) subs.set(coll, new Set()); subs.get(coll).add(cb);
      loaded.then(() => cb(snap(coll))).catch(e => err && err(e));
      return () => subs.get(coll).delete(cb);
    } }; }
  };
  window.ERP_LOCAL = {all: async () => { await loaded; return [...cache].filter(([, v]) => !v.__deleted).map(([p, v]) => [p, clean(v)]); }, put: (p, v) => put(p, {...v, __rev: Date.now(), __ver: cache.get(p)?.__ver || 0})};

  /* photos of paper invoices stay on the device (and sync as files later) */
  const urls = {};
  const assets = { async upload(file){ const id = Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, "0")).join(""); await tx("blobs", "readwrite", s => s.put(file, id)); return {id}; } };
  async function fixImg(img){
    const m = /\/_blob\/([0-9a-f]+)/.exec(img.getAttribute("src") || ""); if (!m) return;
    const id = m[1]; if (!urls[id]){ const b = await tx("blobs", "readonly", s => s.get(id)).catch(() => null); if (!b) return; urls[id] = URL.createObjectURL(b); }
    img.src = urls[id];
  }
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType !== 1) return; (n.tagName === "IMG" ? [n] : n.querySelectorAll("img[src^='/_blob/']")).forEach(fixImg); }))).observe(document.documentElement, {childList: true, subtree: true});

  const downloads = { async save({filename, data}){ const a = document.createElement("a"); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data])); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); } };

  const me = () => ({id: lsGet("erp.userId", null) || (() => { const id = "dev_" + Math.random().toString(36).slice(2, 10); lsSet("erp.userId", id); return id; })(), name: lsGet("erp.userName", "")});
  const user = { me: async () => me(), can: async () => true, profiles: async ids => { const names = lsGet("erp.names", {}); return Object.fromEntries(ids.map(id => [id, {name: names[id] || ""}])); } };

  /* ---------- cloud sync (Supabase). Off until the pharmacy connects its own project in Settings ---------- */
  const SYNC = window.ERP_SYNC = {
    cfg: () => lsGet("erp.sync", null),
    status: lsGet("erp.syncStatus", {state: "off"}),
    set(st){ this.status = {...st, at: new Date().toISOString()}; lsSet("erp.syncStatus", this.status); window.render && window.render(); },
    pending: () => dirty.size,
    t: null,
    soon(){ clearTimeout(this.t); this.t = setTimeout(() => this.run(), 1500); },
    // the pharmacy types these by hand: fix the usual slips (http, missing https, trailing slash, spaces) before using them
    cleanUrl(u){ u = String(u || "").trim().replace(/\s+/g, "").replace(/\/+$/, ""); if (u && !/^[a-z]+:\/\//i.test(u)) u = "https://" + u; return /^http:\/\/(?!localhost|127\.)/i.test(u) ? u.replace(/^http:/i, "https:") : u; },
    async login(url, anon, email, password){
      url = this.cleanUrl(url); anon = String(anon || "").trim(); email = String(email || "").trim();
      let r; try { r = await fetch(url + "/auth/v1/token?grant_type=password", {method: "POST", headers: {apikey: anon, "Content-Type": "application/json"}, body: JSON.stringify({email, password})}); }
      catch { throw new Error("Can't reach the cloud. Check the internet, and that the Project URL looks like https://xxxx.supabase.co"); }
      const j = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(/invalid login/i.test(j.error_description || j.msg || "") ? "Wrong email or password. Check them and try again." : r.status === 401 || /api key|apikey/i.test(j.message || j.msg || "") ? "The public key is not right. Copy the Publishable key again from Supabase." : (j.error_description || j.msg || "Sign-in failed. Check the Project URL, key, email and password."));
      lsSet("erp.sync", {url, anon, email, token: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000, ver: 0});
      for (const [p, v] of cache) if (!v.__ver && !v.__deleted) dirty.add(p); lsSet("erp.dirty", [...dirty]); // a device with data joins the pharmacy: upload it
      lsSet("erp.userId", j.user?.id || me().id); lsSet("erp.userName", j.user?.user_metadata?.name || email);
      this.run();
    },
    clearConflicts(){ lsSet("erp.conflicts", 0); this.set({state: "ok"}); },
    logout(){ lsSet("erp.sync", null); this.set({state: "off"}); },
    async token(c){
      if (Date.now() < c.exp - 60000) return c.token;
      const r = await fetch(c.url + "/auth/v1/token?grant_type=refresh_token", {method: "POST", headers: {apikey: c.anon, "Content-Type": "application/json"}, body: JSON.stringify({refresh_token: c.refresh})});
      const j = await r.json(); if (!r.ok) throw new Error("Signed out. Sign in again in Settings.");
      Object.assign(c, {token: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000}); lsSet("erp.sync", c); return c.token;
    },
    busy: false,
    async run(){
      const c = this.cfg(); if (!c || this.busy) return;
      if (!navigator.onLine){ this.set({state: "offline"}); return; }
      this.busy = true;
      try {
        await loaded;
        const tok = await this.token(c), h = {apikey: c.anon, Authorization: "Bearer " + tok, "Content-Type": "application/json"};
        const send = [...dirty].map(p => ({path: p, data: strip(cache.get(p)), base: cache.get(p)?.__ver || 0, rev: cache.get(p)?.__rev, device: me().id}));
        let lost = 0;
        for (let i = 0; i < send.length; i += 100){
          const batch = send.slice(i, i + 100);
          const r = await fetch(c.url + "/rest/v1/rpc/erp_push", {method: "POST", headers: h, body: JSON.stringify({rows: batch.map(({rev, ...x}) => x)})});
          if (r.status === 404) throw new Error("The cloud setup is old. Run the newest setup SQL in Supabase.");
          if (!r.ok) throw new Error(r.status === 401 || r.status === 403 ? "This account is not on the pharmacy list. Ask the owner to add it." : "Cloud refused the changes (" + r.status + ").");
          for (const x of await r.json()){
            const sent = batch.find(b => b.path === x.path), cur = cache.get(x.path);
            if (x.ok){ if (cur && cur.__rev === sent.rev){ dirty.delete(x.path); cur.__ver = x.ver; await tx("docs", "readwrite", s => s.put(cur, x.path)); } else if (cur) cur.__ver = x.ver; }
            else { lost++; dirty.delete(x.path); await put(x.path, {...x.data, __rev: x.data.__rev || 0, __ver: x.ver}, true); } // another device saved first: take theirs, yours is kept in the cloud (erp_conflicts)
          }
          lsSet("erp.dirty", [...dirty]);
        }
        if (lost) lsSet("erp.conflicts", (lsGet("erp.conflicts", 0)) + lost);
        let since = Math.max(0, (c.ver || 0) - 100), top = c.ver || 0, more = true; // a little overlap, in case a change committed late
        while (more){
          const r = await fetch(c.url + "/rest/v1/erp_docs?select=path,data,ver&ver=gt." + since + "&order=ver.asc&limit=500", {headers: h});
          if (!r.ok) throw new Error("Couldn't read from the cloud (" + r.status + ").");
          const rows = await r.json();
          for (const row of rows){ const cur = cache.get(row.path); if (!dirty.has(row.path) && (!cur || (cur.__ver || 0) < row.ver)) await put(row.path, {...row.data, __ver: row.ver}, true); since = Math.max(since, row.ver); top = Math.max(top, row.ver); }
          more = rows.length === 500;
        }
        c.ver = top; lsSet("erp.sync", c);
        this.set(lsGet("erp.conflicts", 0) ? {state: "ok", conflicts: lsGet("erp.conflicts", 0)} : {state: "ok"});
      } catch(e){ this.set({state: "error", msg: e.message}); }
      finally { this.busy = false; }
    }
  };
  window.addEventListener("online", () => SYNC.run());
  window.addEventListener("offline", () => SYNC.set({state: "offline"}));
  setInterval(() => SYNC.run(), 60000);
  setTimeout(() => SYNC.run(), 2000);

  window.claude = { use: async name => {
    if (name === "db") return db;
    if (name === "assets") return assets;
    if (name === "downloads") return downloads;
    if (name === "user") return user;
    return null; // photo reading needs Claude: only on claude.ai for now
  } };
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();

</script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const TOL = 250; // IQD rounding tolerance per invoice
const BOOKED = ["Approved for Posting","Posted to Mercato","Reconciled"];
const S = {tab:"home", filter:"all", sort:"name", fridgeOnly:false, q:"", suppliers:[], invoices:[], payments:[], credits:[], allCredits:[], meta:{}, names:{}, meId:null, ready:false, db:null, readOnly:false};
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const n0 = v => (typeof v === "number" && isFinite(v)) ? v : 0;
const isNum = v => typeof v === "number" && isFinite(v);
const iqd = v => isNum(v) ? Math.round(v).toLocaleString("en-US") + " IQD" : "—";
const pct = v => isNum(v) ? (Math.round(v*1000)/10) + "%" : "—";
const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const days = (a,b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);
const addDays = (d,k) => new Date(Date.parse(d) + k*864e5).toISOString().slice(0,10);
const normNo = s => String(s||"").replace(/[\s\-\/]/g,"").replace(/^0+/,"").toUpperCase();
const parseNum = s => { const t = String(s ?? "").replace(/[,'\s٬]/g,"").replace(/٫/g,".").replace(/[٠-٩]/g, d => "٠١٢٣٤٥٦٧٨٩".indexOf(d)); if (t === "") return null; const x = Number(t); return isFinite(x) ? x : NaN; };

const FORMS = [
  [/\b(needles?|novofine)\b/i, "Needle"],
  [/\bvag(inal)?\s*caps?\b/i, "Vaginal capsule"],
  [/\bpessar(y|ies)\b/i, "Pessary"],
  [/\bsupp(ository|ositories|s)?\b/i, "Suppository"],
  [/\b(film[- ]?coated\s*)?tab(let)?s?\b/i, "Tablet"],
  [/\bcaps?(ule)?s?\b/i, "Capsule"],
  [/\bamp(oule|ule)?s?\b/i, "Ampoule"],
  [/\bvials?\b/i, "Vial"],
  [/\bpens?\b/i, "Pen"],
  [/\b(syringes?|seringues?)\b/i, "Prefilled syringe"],
  [/\beye\s*drops?\b/i, "Eye drops"],
  [/\bdrops?\b/i, "Drops"],
  [/\beye\s*gel\b/i, "Eye gel"],
  [/\bgel\b/i, "Gel"],
  [/\bcream\b/i, "Cream"],
  [/\boint(ment)?\b/i, "Ointment"],
  [/\bsyrup\b/i, "Syrup"],
  [/\bsusp(ension)?\b/i, "Suspension"],
  [/\bsachets?\b/i, "Sachet"],
  [/\bspray\b/i, "Spray"],
  [/\binhaler\b/i, "Inhaler"],
];
function parseDesc(desc){
  const raw = String(desc || "");
  const fridge = /براد|\bfridge\b|refrigerat/i.test(raw);
  let d = raw.replace(/\(\s*براد\s*\)/g, " ").replace(/براد/g, " ").replace(/\*\*/g, " ").replace(/\s+/g, " ").trim();
  let form = null, formAt = -1, formWord = "";
  for (const [re, name] of FORMS){ const m = re.exec(d); if (m){ form = name; formAt = m.index; formWord = m[0]; break; } }
  let blisters = null, perBlister = null, pack = null;
  const bl = /(\d{1,2})\s*[*x×]\s*(\d{1,3})/i.exec(d);
  if (bl && +bl[1] >= 1 && +bl[1] <= 10){ blisters = +bl[1]; perBlister = +bl[2]; pack = blisters * perBlister; }
  else if (formAt > 0){ const m = /(\d{1,4})\s*$/.exec(d.slice(0, formAt).trim()); if (m) pack = +m[1]; }
  const unit = "(?:unites|units?|mcg|µg|mg|iu|ml|g|%)";
  const sre = new RegExp(`(\\d[\\d,.']*\\s*${unit}(?:\\s*/\\s*\\d*[\\d.]*\\s*${unit})?(?:\\s*\\(\\s*\\d[\\d.]*\\s*${unit}\\s*\\))?(?:\\s*/\\s*\\d*[\\d.]*\\s*${unit})?)`, "i");
  const sm = sre.exec(d);
  const strength = sm ? sm[1].replace(/\s+/g, " ").replace(/unites/i, "Units").trim() : null;
  let cut = d.length;
  if (sm) cut = Math.min(cut, sm.index);
  if (bl) cut = Math.min(cut, bl.index);
  if (formAt >= 0) cut = Math.min(cut, formAt);
  const firstNum = /\s\d/.exec(d); if (firstNum) cut = Math.min(cut, firstNum.index);
  let name = d.slice(0, cut).replace(/[(\[]\s*$/, "").trim();
  if (!name) name = d.split(" ")[0];
  return {name, strength, form, pack, blisters, perBlister, fridge};
}

function attrs(l){
  const p = parseDesc(l.desc);
  const pick = (k, v) => (l[k] !== undefined && l[k] !== null && l[k] !== "") ? l[k] : v;
  return {name: pick("name", p.name), strength: pick("strength", p.strength), form: pick("form", p.form), pack: pick("pack", p.pack), blisters: pick("blisters", p.blisters), fridge: typeof l.cold === "boolean" ? l.cold : p.fridge};
}
function lineGross(l){ return n0(l.qty) * n0(l.price); }
function lineDisc(l){ const g = lineGross(l); return isNum(l.discAmt) ? l.discAmt : isNum(l.discPct) ? g * l.discPct / 100 : 0; }
function lineBad(l){ return isNum(l.value) && Math.abs(lineNet(l) - l.value) > 1 && Math.abs(lineGross(l) - l.value) > 1; } // printed value may be before or after the line discount
function lineNet(l){ return lineGross(l) - lineDisc(l); }
function bonusFrom(qty, v, mode){ return mode === "%" ? (isNum(qty) && isNum(v) ? Math.floor(qty * v / 100) : null) : v; }
const FORM_NAMES = [...new Set(FORMS.map(f => f[1]))];
/* ---------- derived numbers ---------- */
function whoName(id){ return !id ? "" : id === S.meId ? (S.meName ? S.meName + " (you)" : "you") : (S.names[id] || "a team member"); }
function supplier(id){ return S.suppliers.find(s => s.id === id); }
function supName(id){ return supplier(id)?.name || id || "Unknown supplier"; }
const STALE_DAYS = 30, CASH_DAYS = 7; // alert when unpaid longer than this after the invoice date: credit 1 month, cash 1 week
const limitDays = inv => inv.type === "cash" ? CASH_DAYS : STALE_DAYS;
const limitText = inv => inv.type === "cash" ? "1 week (cash)" : "1 month";
const staleList = () => S.invoices.filter(i => calc(i).stale).sort((a,b) => (a.date||"").localeCompare(b.date||""));
function calc(inv){
  const lines = inv.lines || [];
  let sum = 0, gross = 0, mismatches = 0, bonusUnits = 0, units = 0, cold = 0;
  for (const l of lines){
    const net = lineNet(l);
    sum += net; gross += lineGross(l); bonusUnits += n0(l.bonus); units += n0(l.qty) + n0(l.bonus); if (attrs(l).fridge) cold++;
    if (lineBad(l)) mismatches++;
  }
  // with no priced lines, an invoice discount applies to the printed total
  const discBase = gross ? sum : n0(inv.printedTotal);
  const invDisc = isNum(inv.invoiceDiscountPct) ? discBase * inv.invoiceDiscountPct / 100 : n0(inv.invoiceDiscount);
  const total = (gross ? sum : n0(inv.printedTotal)) - invDisc;
  // the paper total may or may not already include the invoice discount; accept either
  let diff = isNum(inv.printedTotal) && gross ? total - inv.printedTotal : null;
  if (diff !== null && Math.abs(diff) > TOL){ for (const alt of [sum, gross]) if (Math.abs(alt - inv.printedTotal) <= TOL){ diff = alt - inv.printedTotal; break; } }
  const okTol = diff !== null && Math.abs(diff) <= TOL;
  const credited = S.credits.filter(x => x.invoiceId === inv.id && x.verified).reduce((a,x) => a + n0(x.amount), 0);
  const settled = S.payments.filter(p => p.invoiceId === inv.id && p.verified).reduce((a,p) => a + n0(p.amount) + n0(p.discount), 0) + credited;
  // amount owed is always the total after discounts
  const base = total;
  const outstanding = base - settled;
  const sup = supplier(inv.supplierId);
  let due = inv.dueDate || (sup && isNum(sup.creditDays) ? addDays(inv.date, sup.creditDays) : null);
  if (inv.type === "cash" && inv.date){ const max = addDays(inv.date, CASH_DAYS); if (!due || due > max) due = max; } // cash is due within 1 week at most
  const returnBy = sup && isNum(sup.returnDays) ? addDays(inv.date, sup.returnDays) : null;
  let payStatus = outstanding <= 0 ? "Paid" : settled > 0 ? "Partly paid" : "Unpaid";
  if (outstanding > 0 && due && due < today()) payStatus = "Overdue";
  const tiers = (sup?.discountTiers || []).filter(t => isNum(t.days) && isNum(t.pct));
  const age = days(inv.date, today());
  const disc = tiers.filter(t => age <= t.days).reduce((m,t) => Math.max(m, t.pct), 0);
  const dup = S.invoices.filter(o => o.id !== inv.id && o.supplierId === inv.supplierId && normNo(o.invoiceNo) === normNo(inv.invoiceNo)).length;
  return {lines:lines.length, sum, gross, lineDisc: gross - sum, invDisc, discount: (gross ? gross : n0(inv.printedTotal)) - total, total, dueAmt: base, diff, okTol, mismatches, bonusUnits, units, cold, settled, outstanding, due, returnBy, payStatus, disc, tiersKnown: tiers.length > 0, dup, age, credited, stale: outstanding > 0 && age > limitDays(inv)};
}
// spreads the invoice discount and the payment (early-payment) discount over the items by their value, so each item shows its real discount and net cost
// share of each line that is still owed after the invoice-level discount (1 when there is none)
function invFactor(inv){ const c = calc(inv); return c.sum > 0 ? c.total / c.sum : 1; }
function itemDiscounts(inv){
  const c = calc(inv), lines = inv.lines || [];
  const payDisc = S.payments.filter(p => p.invoiceId === inv.id && p.verified).reduce((a,p) => a + n0(p.discount), 0);
  const extra = c.invDisc + payDisc, base = c.sum;
  let left = Math.round(extra), lastK = -1;
  lines.forEach((l,k) => { if (lineNet(l) > 0) lastK = k; });
  const rows = lines.map((l,k) => {
    const gross = lineGross(l), net = lineNet(l);
    let share = base > 0 && net > 0 ? Math.round(extra * net / base) : 0;
    if (k === lastK) share = left; left -= share;
    const disc = Math.round(lineDisc(l)) + share, fin = Math.round(gross) - disc, u = n0(l.qty) + n0(l.bonus);
    return {l, k, gross:Math.round(gross), disc, pct: gross ? disc / gross : 0, net:fin, perPaid: n0(l.qty) ? fin / n0(l.qty) : null, perUnit: u ? fin / u : null};
  });
  const t = rows.reduce((a,r) => ({gross:a.gross + r.gross, disc:a.disc + r.disc, net:a.net + r.net}), {gross:0, disc:0, net:0});
  return {rows, t, payDisc, invDisc:c.invDisc};
}

function lineNote(inv, l){
  const n = l.note || ""; if (!BOOKED.includes(inv.status)) return n;
  return n.split(" · ").filter(x => !/confirm|check|unclear|not sure/i.test(x)).join(" · ");
}
function balance(sid){
  const s = supplier(sid);
  // the opening balance counts only when verified and not set aside ("leave out until older invoices are entered")
  const open = s && s.openingVerified && !s.openingExcluded && isNum(s.openingBalance) ? s.openingBalance : 0;
  // debt is automatic (owner's rule): every invoice entered counts after discount, every verified payment and confirmed return takes it off
  const inv = S.invoices.filter(i => i.supplierId === sid).reduce((a,i) => a + calc(i).dueAmt, 0);
  const pays = S.payments.filter(p => p.supplierId === sid && p.verified).reduce((a,p) => a + n0(p.amount) + n0(p.discount), 0);
  const credits = S.credits.filter(x => x.supplierId === sid && x.verified).reduce((a,x) => a + n0(x.amount), 0);
  const pending = S.invoices.filter(i => i.supplierId === sid && !BOOKED.includes(i.status)).reduce((a,i) => a + Math.max(0, calc(i).outstanding), 0);
  return {open, verified: !!(s && s.openingVerified), inv, pays, credits, bal: open + inv - pays - credits, pending};
}

function diffFields(before, after, fields){
  const out = [];
  for (const [k, label, f] of fields){ const a = f ? f(before) : before?.[k], b = f ? f(after) : after?.[k]; if (String(a ?? "") !== String(b ?? "")) out.push({field:label, from:a ?? "", to:b ?? ""}); }
  return out;

function payRoom(inv){

/* ---------- writes ---------- */
async function write(path, data, merge){
  if (!S.db) throw new Error("Saving is not available in this view.");
  const ref = S.db.doc(path);
  if (data && typeof data === "object" && S.meId) data = {...data, lastBy:S.meId, lastAt:new Date().toISOString()};
  try { merge ? await ref.update(data) : await ref.set(data); }
  catch (e) {
    if (e && e.code === "invalid_argument" && !merge){ S.readOnly = true; }
    throw new Error(e?.code === "quota_exceeded" ? "Storage is full. Delete old records before adding more." : e?.code === "invalid_argument" ? "You don't have permission to change this data." : "Couldn't save. Check your connection and try again.");
  }
}
function nextPid(){
  const y = new Date().getFullYear(); const nums = S.invoices.map(i => /PI-(\d{4})-(\d+)/.exec(i.pid||i.id)).filter(m => m && +m[1] === y).map(m => +m[2]);
  return `PI-${y}-${String((nums.length ? Math.max(...nums) : 0) + 1).padStart(4,"0")}`;
}
async function saveInvoice(e){
  e.preventDefault();
  const inv = readInvoice(), err = $("#formErr");
  inv.lines = inv.lines.filter(l => l.desc || isNum(l.qty) || isNum(l.price));
  const bad = [];
  if (inv.supplierId === "__new" && !inv.newSupplierName) bad.push("the new supplier's name");
  if (!inv.invoiceNo) bad.push("invoice number");
  if (!inv.date) bad.push("date");
  else if (inv.date > addDays(today(), 1)) bad.push("an invoice date that is not in the future");
  if (!isNum(inv.printedTotal)) bad.push("printed total");
  if (!inv.lines.length) bad.push("at least one line");
  if (inv.lines.some(l => Number.isNaN(l.pack) || Number.isNaN(l.blisters))) bad.push("numbers only in pack size");
  if (inv.lines.some(l => Number.isNaN(l.discPct) || Number.isNaN(l.discAmt) || Number.isNaN(l.bonusPct) || (isNum(l.discPct) && (l.discPct < 0 || l.discPct > 100)) || (isNum(l.bonusPct) && (l.bonusPct < 0 || l.bonusPct > 100)))) bad.push("discount and bonus % between 0 and 100");
  if (inv.lines.some(l => Number.isNaN(l.qty) || Number.isNaN(l.price) || Number.isNaN(l.value) || Number.isNaN(l.bonus))) bad.push("numbers only in qty, price and value");
  if (inv.lines.some(l => l.expiry && !/^\d{4}-\d{2}$/.test(l.expiry))) bad.push("expiry as YYYY-MM");
  if (bad.length){ err.textContent = "Please add: " + bad.join(", ") + "."; return; }
  const c = calc(inv);
  if (c.dup){ err.textContent = `${supName(inv.supplierId)} invoice ${inv.invoiceNo} is already in the app. Open that one instead of adding a duplicate.`; return; }
  { const stop = window.ERP_INV_GUARD?.(inv); if (stop){ err.innerHTML = stop; return; } }
  if (S.saving) return; S.saving = true; // a second tap while saving must not create a second invoice
  for (const l of inv.lines){ for (const k of ["qty","bonus","bonusPct","discPct","discAmt","price","value","note","no","name","strength","form","pack","blisters"]) if (l[k] === null || l[k] === undefined) delete l[k]; }
  if (inv.supplierId === "__new"){
    const nums = S.suppliers.map(x => +(/SUP-(\d+)/.exec(x.id)||[])[1]||0); const sid = "SUP-" + String(Math.max(0,...nums)+1).padStart(3,"0");

    catch(x){ S.saving = false; err.textContent = x.message; return; }
    inv.supplierId = sid; S.suppliers.push({id:sid, name:inv.newSupplierName});
  }
  delete inv.newSupplierName; delete inv.newSupplierAr;
  const old = inv.id ? S.invoices.find(x => x.id === inv.id) : null;
  if (!inv.id){ inv.pid = nextPid(); inv.id = inv.pid; inv.createdAt = new Date().toISOString(); inv.createdBy = S.meId; inv.receiving = "pending"; }
  { // new lines get the next id, never one used before on this invoice; receiving checks follow their line
    const lidOf = (l, j) => String(l.lid ?? j), nums = [...(old?.lines || []).map(lidOf), ...inv.lines.filter(l => l.lid != null).map(l => l.lid)].map(Number).filter(Number.isFinite);
    let seq = Math.max(n0(old?.lidSeq), nums.length ? Math.max(...nums) + 1 : 0);
    inv.lines.forEach(l => { if (l.lid == null) l.lid = String(seq++); }); inv.lidSeq = seq;
    window.ERP_KEEP_PRODUCT?.(old, inv);
    if (old?.receivedLines){ const pos = {}; (old.lines || []).forEach((l, j) => pos[lidOf(l, j)] = j); const rl = {};
      inv.lines.forEach((l, k) => { const r = old.receivedLines[pos[l.lid]]; if (r) rl[k] = r; }); inv.receivedLines = rl; }
  }
  if (old && needsReason(old)){
    const reason = $("#fReason")?.value.trim(), changes = diffFields(old, inv, INV_FIELDS);
    if (changes.length && !reason){ S.saving = false; err.textContent = "Write the reason for the change."; return; }

    // keep approval when the amount owed did not change; otherwise it needs approving (and correcting in MyPharma) again
    const sameDue = Math.abs(calc(old).dueAmt - c.dueAmt) <= 1;
    inv.status = sameDue && BOOKED.includes(old.status) ? old.status : c.okTol ? "Awaiting Approval" : "Validation Required";
    if (!sameDue && old.mercatoRef) inv.notes = [inv.notes, `Amount changed after entry in MyPharma (${old.mercatoRef}); correct it there too.`].filter(Boolean).join(" ");
  } else

  inv.updatedAt = new Date().toISOString();
  try { await write("invoices/" + inv.id, inv); S.saving = false; closeSheet(); toast(`Saved ${inv.pid}.`); }
  catch(x){ S.saving = false; err.textContent = x.message; }
}
async function savePayment(e){
  e.preventDefault();
  const amt = parseNum($("#pAmt").value), err = $("#payErr");
  let disc = parseNum($("#pDisc").value);
  if ($("#pDiscMode").value === "%" && isNum(disc)){
    const inv0 = S.invoices.find(i => i.id === $("#pInv").value);
    if (!inv0){ err.textContent = "Choose the invoice to use a % discount, or enter the discount in IQD."; return; }
    if (disc < 0 || disc > 100){ err.textContent = "Discount % must be between 0 and 100."; return; }
    disc = payDiscIQD(inv0);
  }
  { const i0 = S.invoices.find(i => i.id === $("#pInv").value); if (!S.editPay && i0 && payRoom(i0) <= TOL){ err.textContent = "This invoice is already paid or has a payment waiting to be verified. Open that payment to change it."; return; } }
  if (!isNum(amt) || amt <= 0){ err.textContent = "Enter the amount paid."; return; }
  if (Number.isNaN(disc) || (isNum(disc) && disc < 0)){ err.textContent = "Discount must be a positive number or blank."; return; }
  const invId = $("#pInv").value || null, sid = $("#pSup").value, ep = S.editPay;
  const inv = S.invoices.find(i => i.id === invId);
  if (inv && inv.supplierId !== sid){ err.textContent = "That invoice belongs to a different supplier."; return; }
  // when editing, this payment's own old amount is not part of what is still owed
  const room = inv ? payRoom(inv) : 0;
  if (inv && amt + n0(disc) - room > TOL){ err.textContent = `This is more than the ${iqd(room)} outstanding. Leave it unallocated or split it.`; return; }
  if (!ep && inv && room <= TOL){ err.textContent = "This invoice is already fully paid or has a payment waiting to be verified. Open that payment to change it."; return; }
  if (!ep && S.payments.some(p => p.invoiceId && p.invoiceId === invId && Math.abs(n0(p.amount) - amt) <= 1 && p.date === ($("#pDate").value || today()))){ err.textContent = "The same payment (amount and date) is already recorded for this invoice."; return; }
  if (S.saving) return; S.saving = true;
  const id = ep ? ep.id : "PAY-" + Date.now().toString(36).toUpperCase();
  const p = {...(ep||{}), id, supplierId:sid, invoiceId:invId, date:$("#pDate").value || today(), amount:amt, discount:isNum(disc)?disc:0, method:$("#pMeth").value, receiptNo:$("#pRec").value.trim(), verified:$("#pVer").checked, notes:$("#pNotes").value.trim(), createdAt:ep?.createdAt || new Date().toISOString(), createdBy:ep?.createdBy || S.meId};
  if (ep){
    const changes = diffFields(ep, p, PAY_FIELDS), reason = $("#pReason").value.trim();
    if (!changes.length && p.notes === (ep.notes||"")){ S.saving = false; closeSheet(); toast("Nothing changed."); return; }
    if (changes.length && !reason){ S.saving = false; err.textContent = "Write the reason for the change."; return; }
    if (changes.length) p.history = [...(ep.history||[]), {at:new Date().toISOString(), by:S.meId, reason, changes}];
    p.updatedAt = new Date().toISOString();
  }
  try { await write("payments/" + id, p); S.saving = false; closeSheet(); S.editPay = null; toast(ep ? "Payment updated." : p.verified ? "Payment saved." : "Payment saved as unverified. It counts once you mark the receipt verified."); }
  catch(x){ S.saving = false; err.textContent = x.message; }
}

/* ---------- scan a photo ---------- */
const EXTRACT = `You are reading a photo of a paper purchase invoice from a pharmaceutical drug store (مذخر) in Iraq, addressed to a pharmacy. Currency is Iraqi dinar (IQD).
Reply with ONLY one JSON object of this shape:
{"supplierName": string|null, "supplierNameAr": string|null, "invoiceNo": string|null, "date": "YYYY-MM-DD"|null, "type": "credit"|"cash"|null,
 "printedTotal": number|null, "invoiceDiscount": number|null, "printedPrevBalance": number|null, "printedTotalDebt": number|null,
 "lines": [{"no": string, "desc": string, "company": string|null, "qty": number|null, "bonus": number|null, "price": number|null, "value": number|null, "batch": string|null, "expiry": "YYYY-MM"|null, "fridge": boolean, "name": string|null, "strength": string|null, "form": string|null, "pack": number|null, "blisters": number|null, "note": string|null}],
 "uncertain": [string]}
Rules:
- Copy product descriptions exactly as printed, including (براد).
- Numbers: the apostrophe or comma is a thousands separator (405'436 = 405436). Convert Arabic-Indic digits.
- qty = the printed quantity (الكمية), price = unit price (السعر), value = line value (القيمة), batch = (باج نمبر / Batch), expiry = (الصلاحية) as YYYY-MM.
- (براد) next to a product means it must be stored in a refrigerator: set fridge true; otherwise false.
- From each description also fill: name = brand/product name only (e.g. "Clexane"), strength = dose as printed (e.g. "6000IU 60mg/0.6ml", "500 mg"), form = dosage form in English (Tablet, Capsule, Suppository, Pessary, Ampoule, Vial, Pen, Prefilled syringe, Drops, Eye drops, Gel, Eye gel, Cream, Ointment, Syrup, Suspension, Sachet, Spray, Vaginal capsule), pack = units per pack (e.g. 28 Tabs = 28; 3*10 Tabs = 30), blisters = number of blister strips 1-10 when shown as N*M (3*10 = 3), else null.
- A line with a quantity but NO value printed is bonus (free goods) for the priced line of the SAME product: do not output it as its own line; add its quantity to that line's "bonus" and say so in "note" (e.g. "Line 19 qty 2 with no value = bonus"). If there is no matching priced line, keep it as its own line with value null and note "No value printed; no matching priced line".
- payment آجل = "credit", نقد = "cash". المجموع الصافي = printedTotal. الديون السابقة = printedPrevBalance. الديون الكلية = printedTotalDebt.
- NEVER guess. If any number, batch, expiry, invoice number or date is unreadable, put null and add a short entry to "uncertain" naming the line and field. Also list handwritten marks or corrections that change a printed value.
- Do not invent lines. Keep the printed line order.`;
async function scanPhoto(file){
  if (!file) return;
  const ctl = new AbortController(); S.scanCtl = ctl;
  openSheet("Reading invoice", `<div class="busy"><span class="spin"></span><span id="scanMsg">Saving the original photo…</span></div><p class="note">This can take up to a minute. Keep this screen open.</p><button type="button" id="scanStop">Stop</button>`);
  let photoId = null;
  try { if (S.assets){ const r = await S.assets.upload(file, {type: file.type || "image/jpeg"}); photoId = r.id; } }
  catch(e){ /* keep going without storing the photo */ }
  const msg = $("#scanMsg"); if (msg) msg.textContent = "Reading the invoice…";
  let out;
  try { out = await S.sample.json(EXTRACT, {images:[file], signal:ctl.signal, modelTier:"complex", cache:false}); }
  catch(e){
    if (e && e.code === "cancelled"){ closeSheet(); return; }
    const copy = {not_granted:"Reading photos needs your permission. Allow it when asked, or enter the invoice by hand.", rate_limited:"Too many requests right now. Wait a minute and try again.", image_rejected:"That photo couldn't be read. Try a sharper JPEG or PNG under 20 MB.", invalid_json:"The reply couldn't be understood. Try again, or enter the invoice by hand.", refused:"This photo couldn't be processed. Enter the invoice by hand."}[e?.code] || "Reading the photo failed. Try again, or enter the invoice by hand.";
    openSheet("Couldn't read the photo", `<p>${esc(copy)}</p><div class="actions"><button type="button" class="primary" data-act="scan">Try another photo</button><button type="button" data-act="newInv">Enter by hand</button></div>`);
    return;
  }
  if (!out || typeof out !== "object"){ openSheet("Couldn't read the photo", `<p>No invoice data came back. Try a clearer photo.</p>`); return; }
  const num = v => (typeof v === "number" && isFinite(v)) ? v : (typeof v === "string" ? (x => isFinite(x) ? x : null)(parseNum(v)) : null);
  const nm = String(out.supplierName || "").toLowerCase(), nmAr = String(out.supplierNameAr || "");
  const match = S.suppliers.find(s => (nm && s.name && (nm.includes(s.name.toLowerCase()) || s.name.toLowerCase().includes(nm))) || (nmAr && s.nameAr && (nmAr.includes(s.nameAr) || s.nameAr.includes(nmAr))));
  const uncertain = Array.isArray(out.uncertain) ? out.uncertain.map(String).slice(0,40) : [];
  if (isNum(num(out.printedPrevBalance)) && isNum(num(out.printedTotal)) && isNum(num(out.printedTotalDebt)) && Math.abs(num(out.printedPrevBalance) + num(out.printedTotal) - num(out.printedTotalDebt)) > 1) uncertain.push("Printed previous debt + this invoice doesn't equal printed total debt.");
  const pre = {
    supplierId: match ? match.id : "__new", newSupplierName: match ? "" : (out.supplierName || out.supplierNameAr || ""), newSupplierAr: out.supplierNameAr || "",
    invoiceNo: out.invoiceNo ? String(out.invoiceNo) : "", date: /^\d{4}-\d{2}-\d{2}$/.test(out.date||"") ? out.date : "",
    type: out.type === "cash" ? "cash" : "credit", printedTotal: num(out.printedTotal), invoiceDiscount: num(out.invoiceDiscount), printedPrevBalance: num(out.printedPrevBalance),
    lines: (Array.isArray(out.lines) ? out.lines : []).map(l => ({no: l.no ? String(l.no) : undefined, desc: String(l.desc || ""), qty: num(l.qty), bonus: num(l.bonus), price: num(l.price), value: num(l.value), batch: l.batch ? String(l.batch) : "", expiry: /^\d{4}-\d{2}$/.test(l.expiry||"") ? l.expiry : "", cold: !!(l.fridge ?? l.cold), name: l.name ? String(l.name) : null, strength: l.strength ? String(l.strength) : null, form: l.form ? String(l.form) : null, pack: num(l.pack), blisters: (n => isNum(n) && n >= 1 && n <= 10 ? n : null)(num(l.blisters)), note: l.note ? String(l.note) : undefined})),
    photo: photoId, extraction: {uncertain, at: new Date().toISOString(), source: "photo"}, notes: ""
  };
  if (!pre.date) uncertain.push("Invoice date not read; enter it.");
  invoiceForm(null, pre);
}

// how many units of line k of an invoice were already returned on earlier (not cancelled) returns
function returnedQty(invId, k){ const l = S.invoices.find(i => i.id === invId)?.lines?.[k], lid = String(l?.lid ?? k);

    ${S.readOnly || x.voided ? "" : `<div class="actions"><button type="button" class="primary" data-crver="${esc(x.id)}">${x.verified ? "Mark not confirmed" : "Supplier confirmed it"}</button><button type="button" class="danger" data-crvoid="${esc(x.id)}">Cancel this return</button></div>`}
    <div class="err" id="crDetErr"></div>`);
}

/* ---- 3 supplier statement check ---- */
function statementSheet(sid, amount, asOf){
  const s = supplier(sid); if (!s) return;
  const date = asOf || today();
  const printedDebt = i => isNum(i.printedTotalDebt) ? i.printedTotalDebt : isNum(i.printedPrevBalance) && isNum(i.printedTotal) ? i.printedPrevBalance + i.printedTotal : null;
  const printed = [...S.invoices].filter(i => i.supplierId === sid && isNum(printedDebt(i))).sort((a,b) => (b.date||"").localeCompare(a.date||""))[0];
  S.stmt = {sid, date, amount: isNum(amount) ? amount : null, off:new Set()};
  openSheet(`Statement check · ${s.name}`, `<p class="note">Type the total debt printed on the supplier's statement or latest invoice. The app compares it with your records up to that date. Untick anything that is not on their statement to find the difference.</p>
    <div class="grid2 stack"><label>Supplier says you owe (IQD)<input id="stAmt" class="num" inputmode="decimal" value="${isNum(amount) ? amount : ""}"></label>
    <label>As of<input id="stDate" type="date" value="${esc(date)}"></label></div>
    ${printed ? `<button type="button" data-stfill="${esc(printed.id)}" data-amt="${printedDebt(printed)}">Use ${iqd(printedDebt(printed))} printed on invoice ${esc(printed.invoiceNo)}</button>` : ""}
    <div id="stBody"></div>`);
  stmtRefresh();
}
function stmtRows(){
  const {sid, date} = S.stmt;
  const inv = S.invoices.filter(i => i.supplierId === sid && i.date <= date).map(i => ({k:"i:"+i.id, date:i.date, label:`Invoice ${i.invoiceNo}${BOOKED.includes(i.status) ? "" : " (not approved)"}`, amt:calc(i).dueAmt}));
  const pay = S.payments.filter(p => p.supplierId === sid && p.verified && p.date <= date).map(p => ({k:"p:"+p.id, date:p.date, label:`Payment${p.receiptNo ? " receipt " + p.receiptNo : ""}${n0(p.discount) ? ` (incl. ${iqd(p.discount)} discount)` : ""}`, amt:-(n0(p.amount) + n0(p.discount))}));
  const cr = S.credits.filter(x => x.supplierId === sid && x.verified && x.date <= date).map(x => ({k:"c:"+x.id, date:x.date, label:`${x.type}${x.ref ? " " + x.ref : ""}`, amt:-n0(x.amount)}));
  return [...inv, ...pay, ...cr].sort((a,b) => a.date.localeCompare(b.date));
}
function stmtRefresh(){
  const box = $("#stBody"); if (!box || !S.stmt) return;
  const s = supplier(S.stmt.sid), rows = stmtRows();
  const open = n0(s.openingBalance), useOpen = !S.stmt.off.has("open");
  const mine = (useOpen ? open : 0) + rows.filter(r => !S.stmt.off.has(r.k)).reduce((a,r) => a + r.amt, 0);
  const theirs = S.stmt.amount, diff = isNum(theirs) ? theirs - mine : null;
  box.innerHTML = `<div class="sum">
    <div class="r"><span>Your records</span><span class="num">${iqd(mine)}</span></div>
    <div class="r"><span>Supplier's statement</span><span class="num">${isNum(theirs) ? iqd(theirs) : "Type it above"}</span></div>
    <div class="r big"><span>Difference</span><span class="num" style="color:var(--${diff === null ? "muted" : Math.abs(diff) <= TOL ? "good" : "bad"})">${diff === null ? "—" : Math.abs(diff) <= TOL ? "Matches ✓" : (diff > 0 ? "Supplier shows " : "You show ") + iqd(Math.abs(diff)) + " more"}</span></div></div>
    ${diff !== null && Math.abs(diff) <= TOL && !s.openingVerified && isNum(s.openingBalance) && useOpen ? `<button type="button" class="primary" data-stverify="${esc(s.id)}">It matches: mark opening balance ${iqd(s.openingBalance)} as verified</button>` : ""}
    ${diff !== null && Math.abs(diff) > TOL ? `<p class="note">Look for an invoice, payment or return that one side is missing. ${rows.some(r => Math.abs(Math.abs(r.amt) - Math.abs(diff)) <= TOL) ? `<b>Same amount as the difference:</b> ${rows.filter(r => Math.abs(Math.abs(r.amt) - Math.abs(diff)) <= TOL).map(r => esc(r.label)).join(", ")}.` : ""}</p>` : ""}
    <div class="list">
      <label class="row check" style="cursor:pointer"><input type="checkbox" data-stk="open" ${useOpen ? "checked" : ""}><span class="main"><span class="t">Opening balance${s.openingDate ? ` (${esc(s.openingDate)})` : ""}</span><span class="s">${s.openingVerified ? "Verified" : "Not verified yet"}</span></span><span class="end num">${iqd(open)}</span></label>
      ${rows.map(r => `<label class="row check" style="cursor:pointer"><input type="checkbox" data-stk="${esc(r.k)}" ${S.stmt.off.has(r.k) ? "" : "checked"}><span class="main"><span class="t">${esc(r.label)}</span><span class="s num">${esc(r.date)}</span></span><span class="end num">${r.amt < 0 ? "−" : ""}${iqd(Math.abs(r.amt))}</span></label>`).join("")}
    </div>
    ${S.readOnly || !isNum(theirs) ? "" : `<button type="button" data-stsave="1">Save this check</button>`}
    ${(s.statements||[]).length ? `<details><summary>Earlier checks (${s.statements.length})</summary>${[...s.statements].reverse().map(c => `<div class="note">${esc(c.date)}: supplier ${iqd(c.theirs)}, you ${iqd(c.mine)}, ${Math.abs(c.diff) <= TOL ? "matched" : "difference " + iqd(c.diff)}${c.by ? " · " + esc(whoName(c.by)) : ""}</div>`).join("")}</details>` : ""}`;
  S.stmt.mine = mine; S.stmt.diff = diff;
}

/* ---- 4 what to pay this week ---- */
function payBy(i, c){ return c.due || addDays(i.date, i.type === "cash" ? CASH_DAYS : STALE_DAYS); }
function discEnds(i){
  const sup = supplier(i.supplierId), c = calc(i);
  if (!c.disc) return null;
  const t = (sup?.discountTiers||[]).filter(t => t.pct === c.disc && t.days >= c.age).sort((a,b) => b.days - a.days)[0];
  return t ? addDays(i.date, t.days) : null;
}
function payCandidates(scope){
  const week = addDays(today(), 7);
  return S.invoices.map(i => { const c = calc(i); if (c.outstanding <= TOL) return null;
    const by = payBy(i, c), de = discEnds(i), save = c.outstanding * c.disc;
    return {i, c, by, de, save, toPay:c.outstanding - save, late: by < today()}; }).filter(Boolean)
    .filter(x => scope === "all" || x.by <= week || (x.de && x.de <= week));
}
function payView(){
  let list = payCandidates(S.payScope);
  list.sort(S.paySort === "save" ? (a,b) => b.save - a.save || a.by.localeCompare(b.by) : (a,b) => a.by.localeCompare(b.by));
  const chosen = list.filter(x => S.plan[x.i.id] !== false);
  const total = chosen.reduce((a,x) => a + x.toPay, 0), saved = chosen.reduce((a,x) => a + x.save, 0);
  return `<div class="chips" role="group" aria-label="Which invoices">${[["week","Due this week"],["all","All unpaid"]].map(([k,l]) => `<button type="button" data-payscope="${k}" aria-pressed="${S.payScope===k}">${l}</button>`).join("")}
    ${[["due","Soonest first"],["save","Biggest discount first"]].map(([k,l]) => `<button type="button" data-paysort="${k}" aria-pressed="${(S.paySort||"due")===k}">${l}</button>`).join("")}</div>
  <div class="sum"><div class="r big"><span>Cash needed for ticked invoices</span><span class="num">${iqd(total)}</span></div>
    ${saved ? `<div class="r"><span>Early-payment discounts you keep</span><span class="num" style="color:var(--good)">${iqd(saved)}</span></div>` : ""}
    <div class="r note"><span>${chosen.length} of ${list.length} invoices ticked</span><span></span></div></div>
  <div class="list">${list.length ? list.map(x => `<div class="inv"><label class="row check" style="cursor:pointer"><input type="checkbox" data-plan="${esc(x.i.id)}" ${S.plan[x.i.id] !== false ? "checked" : ""}><span class="main"><span class="t">${esc(supName(x.i.supplierId))} · ${esc(x.i.invoiceNo)}</span><span class="s">${x.late ? `<b style="color:var(--bad)">Late since ${esc(x.by)}</b>` : `Pay by ${esc(x.by)}`}${x.de ? ` · ${pct(x.c.disc)} discount until ${esc(x.de)}` : ""}${BOOKED.includes(x.i.status) ? "" : " · not approved yet"}</span></span><span class="end"><span class="num">${iqd(x.toPay)}</span>${x.save ? `<span class="s num">save ${iqd(x.save)}</span>` : ""}</span></label>
    ${S.readOnly ? "" : `<div class="pd"><button type="button" data-markpaid="${esc(x.i.id)}">Pay now</button></div>`}</div>`).join("") : `<div class="empty">${S.payScope === "week" ? "Nothing due this week." : "No unpaid invoices."}</div>`}</div>
  <p class="note">Pay-by date: the supplier's credit days if set, otherwise 1 week for cash and 1 month for credit. Your ticks are kept on this phone.</p>`;
}

/* ---- 5 receiving per line ---- */
const RECV_ISSUES = ["OK","Short","Damaged","Short expiry","Wrong item","Not received"];
function recvSheet(id){
  const i = S.invoices.find(x => x.id === id); if (!i) return;
  const rl = i.receivedLines || {};
  const order = (i.lines||[]).map((l,k) => ({l,k,cold:attrs(l).fridge})).sort((a,b) => (b.cold?1:0) - (a.cold?1:0) || a.k - b.k);
  openSheet(`Receive · ${supName(i.supplierId)} ${i.invoiceNo}`, `<form id="rcForm" class="sec" novalidate data-id="${esc(i.id)}">
    <p class="note">Count what arrived. Refrigerated (براد) lines are listed first. Change only the lines that differ.</p>
    ${order.map(({l,k,cold}) => { const exp = n0(l.qty) + n0(l.bonus), r = rl[k] || {};
      return `<div class="lineedit" data-rl="${k}"><div class="lh"><span>${cold ? `<span class="pill acc">براد</span> ` : ""}${esc(attrs(l).name || l.desc)} ${esc(attrs(l).strength||"")}</span><span class="note num">expected ${exp}</span></div>
      <div class="grid2"><label>Received<input class="num" inputmode="numeric" data-r="qty" value="${isNum(r.qty) ? r.qty : exp}"></label>
      <label>Problem<select data-r="issue">${RECV_ISSUES.map(o => `<option ${o===(r.issue||"OK")?"selected":""}>${o}</option>`).join("")}</select></label></div>
      ${l.expiry ? `<p class="note">Printed expiry ${esc(l.expiry)}${l.batch ? ` · batch ${esc(l.batch)}` : ""}</p>` : ""}</div>`; }).join("")}
    <div class="sum" id="rcSum"></div>
    <div class="err" id="rcErr"></div>
    <button type="submit" class="primary">Save receiving</button></form>`);
  rcSum();
}
function readRecv(){
  const out = {};
  document.querySelectorAll("#rcForm [data-rl]").forEach(el => { out[el.dataset.rl] = {qty:parseNum(el.querySelector('[data-r="qty"]').value), issue:el.querySelector('[data-r="issue"]').value}; });
  return out;
}
function shortage(i, rl){
  let units = 0, value = 0; const lines = [];
  (i.lines||[]).forEach((l,k) => { const r = rl[k]; if (!r) return; const exp = n0(l.qty) + n0(l.bonus);
    const missing = Math.max(0, exp - n0(r.qty)) + (["Damaged","Wrong item","Short expiry"].includes(r.issue) ? n0(r.qty) : 0);
    // missing bonus units cost nothing: only units beyond the bonus are charged
    const charged = Math.max(0, Math.min(n0(l.qty), missing - n0(l.bonus)));
    if (missing > 0 || r.issue !== "OK"){ const unit = n0(l.qty) ? lineNet(l) * invFactor(i) / n0(l.qty) : 0; units += missing; value += charged * unit; lines.push({k, l, missing, issue:r.issue, value:charged * unit}); } });
  return {units, value, lines};
}
function rcSum(){
  const f = $("#rcForm"); if (!f) return;
  const i = S.invoices.find(x => x.id === f.dataset.id), sh = shortage(i, readRecv());
  $("#rcSum").innerHTML = sh.lines.length ? `<div class="r"><span>Lines with a problem</span><span class="num">${sh.lines.length}</span></div><div class="r"><span>Units missing or not usable</span><span class="num">${sh.units}</span></div><div class="r big"><span>Value to claim from supplier</span><span class="num">${iqd(sh.value)}</span></div>` : `<div class="r"><span>Everything received</span><span class="pill good">OK</span></div>`;
}
async function saveRecv(e){
  e.preventDefault();
  const f = $("#rcForm"), i = S.invoices.find(x => x.id === f.dataset.id), rl = readRecv();
  if (Object.values(rl).some(r => !isNum(r.qty) || r.qty < 0)){ $("#rcErr").textContent = "Use whole numbers for received quantities."; return; }
  { const stop = window.ERP_RECV_GUARD?.(i, rl); if (stop){ $("#rcErr").textContent = stop; return; } }
  const sh = shortage(i, rl);
  try { await write("invoices/" + i.id, {receivedLines:rl, receiving: sh.lines.length ? "discrepancy" : "complete", receivedAt:new Date().toISOString(), checkedBy:S.meId}, true);
    toast(sh.lines.length ? "Saved with problems noted." : "All received.");
    if (sh.value > 0 && !S.readOnly){ creditForm({supplierId:i.supplierId, invoiceId:i.id, type:"Return of goods", reason:sh.lines.some(x => x.issue === "Damaged") ? "Damaged" : "Shortage", amount:Math.round(sh.value), items:sh.lines.map(x => `${attrs(x.l).name || x.l.desc} × ${x.missing} (${x.issue})`).join("\n"), source:"receiving"}); }
    else invoiceDetail(i.id); }
  catch(x){ $("#rcErr").textContent = x.message; }
}
function recvSummary(i){
  if (!i.receivedLines) return "";
  const sh = shortage(i, i.receivedLines);
  return sh.lines.length ? `<div class="sum"><b>Problems found${i.checkedBy ? ` by ${esc(whoName(i.checkedBy))}` : ""}</b>${sh.lines.map(x => `<div class="note">• ${esc(attrs(x.l).name || x.l.desc)}: ${x.missing} ${esc(x.issue === "OK" ? "missing" : x.issue.toLowerCase())}${x.value ? ` (${iqd(x.value)})` : ""}</div>`).join("")}</div>` : `<p class="note">Every line checked and received${i.checkedBy ? ` by ${esc(whoName(i.checkedBy))}` : ""}.</p>`;
}

/* ---- 6 expiry watch ---- */
function monthsLeft(exp){ const m = /^(\d{4})-(\d{2})$/.exec(exp||""); if (!m) return null; const t = new Date(); return (+m[1] - t.getFullYear()) * 12 + (+m[2] - (t.getMonth()+1)); }
function expiringItems(months){ return allItems().filter(x => { const m = monthsLeft(x.l.expiry); return m !== null && m <= months; }).sort((a,b) => a.l.expiry.localeCompare(b.l.expiry)); }
function expiryView(){
  const list = expiringItems(S.expMonths);
  return `<div class="chips" role="group" aria-label="Expiring within">${[[0,"Expired"],[3,"3 months"],[6,"6 months"],[12,"12 months"]].map(([k,l]) => `<button type="button" data-expm="${k}" aria-pressed="${S.expMonths===k}">${l} · ${expiringItems(k).length}</button>`).join("")}</div>
  <div class="list">${list.length ? list.map(x => { const m = monthsLeft(x.l.expiry), c = calc(x.inv), canRet = c.returnBy && c.returnBy >= today();
    return `<div class="inv"><button type="button" class="row" data-open="${esc(x.inv.id)}"><span class="main"><span class="t">${esc(x.name || x.l.desc)} ${esc(x.strength||"")} ${x.fridge ? `<span class="pill acc">براد</span>` : ""}</span><span class="s">${esc(x.supplier)} · invoice ${esc(x.inv.invoiceNo)} · qty ${n0(x.l.qty) + n0(x.l.bonus)}${x.l.batch ? ` · batch ${esc(x.l.batch)}` : ""} · ${canRet ? `return by ${esc(c.returnBy)}` : "return window closed"}</span></span><span class="end"><span class="num">${esc(x.l.expiry)}</span><span class="pill ${m < 0 ? "bad" : m <= 3 ? "warn" : ""}">${m < 0 ? "Expired" : m === 0 ? "This month" : `${m} months`}</span></span></button>
    ${S.readOnly ? "" : `<div class="pd"><button type="button" data-retline="${esc(x.inv.id)}:${x.k}">Return to supplier</button></div>`}</div>`; }).join("") : `<div class="empty">No items expiring in this period. Expiry dates come from the invoice lines.</div>`}</div>`;
}

/* ---- 7 price changes ---- */
function prodKey(l){ const a = attrs(l); return [a.name, a.strength, a.form, a.pack].map(v => String(v ?? "").toLowerCase().replace(/\s+/g,"")).join("|"); }
function unitPrice(l){ return n0(l.qty) ? lineNet(l) / n0(l.qty) : null; }
function priceChanges(){
  const seen = new Map(), out = [];
  const lines = []; for (const i of S.invoices) (i.lines||[]).forEach((l,k) => { const u = unitPrice(l); if (isNum(u) && u > 0) lines.push({i, l, k, u, key:prodKey(l)}); });
  lines.sort((a,b) => (a.i.date||"").localeCompare(b.i.date||"") || (a.i.pid||"").localeCompare(b.i.pid||""));
  for (const x of lines){ const prev = seen.get(x.key);
    if (prev && Math.abs(x.u - prev.u) > 1) out.push({inv:x.i, l:x.l, k:x.k, now:x.u, before:prev.u, prevInv:prev.i, pct:(x.u - prev.u) / prev.u});
    seen.set(x.key, x); }
  return out.reverse();
}
function lowestPrices(){
  const best = new Map();
  for (const i of S.invoices) for (const l of (i.lines||[])){ const u = unitPrice(l); if (!isNum(u) || u <= 0) continue; const k = prodKey(l), b = best.get(k); if (!b || u < b.u) best.set(k, {u, sup:supName(i.supplierId)}); }
  return best;
}
function pricesView(){
  const list = priceChanges();
  return `<div class="list">${list.length ? list.map(x => `<button type="button" class="row" data-open="${esc(x.inv.id)}"><span class="main"><span class="t">${esc(attrs(x.l).name || x.l.desc)} ${esc(attrs(x.l).strength||"")}</span><span class="s">${esc(supName(x.inv.supplierId))} ${esc(x.inv.invoiceNo)} (${esc(x.inv.date)}) vs ${esc(supName(x.prevInv.supplierId))} ${esc(x.prevInv.invoiceNo)} (${esc(x.prevInv.date)})</span></span><span class="end"><span class="num">${Math.round(x.before).toLocaleString("en-US")} → ${Math.round(x.now).toLocaleString("en-US")}</span><span class="pill ${x.pct > 0 ? "bad" : "good"}">${x.pct > 0 ? "▲" : "▼"} ${pct(Math.abs(x.pct))}</span></span></button>`).join("") : `<div class="empty">No price changes yet. Once the same product appears on a second invoice, any change in its price after discount shows here.</div>`}</div>
  <p class="note">Compares the price per paid unit after line discounts. Free bonus units are not included.</p>`;
}
function priceNotes(i){
  const ch = priceChanges().filter(x => x.inv.id === i.id), best = lowestPrices();
  const cheaper = (i.lines||[]).map(l => { const b = best.get(prodKey(l)), u = unitPrice(l); return b && isNum(u) && b.u < u - 1 ? {l, b, u} : null; }).filter(Boolean);
  if (!ch.length && !cheaper.length) return "";
  return `<div class="sum"><b>Price check</b>${ch.map(x => `<div class="note">• ${esc(attrs(x.l).name || x.l.desc)}: ${Math.round(x.before).toLocaleString("en-US")} → ${Math.round(x.now).toLocaleString("en-US")} (<span style="color:var(--${x.pct > 0 ? "bad" : "good"})">${x.pct > 0 ? "+" : "−"}${pct(Math.abs(x.pct))}</span>) since invoice ${esc(x.prevInv.invoiceNo)}</div>`).join("")}${cheaper.filter(c => !ch.some(x => x.l === c.l)).map(c => `<div class="note">• ${esc(attrs(c.l).name || c.l.desc)}: cheapest seen ${Math.round(c.b.u).toLocaleString("en-US")} from ${esc(c.b.sup)}</div>`).join("")}</div>`;
}

/* ---- 8 monthly report ---- */
function monthStats(ym){
  const inM = d => (d||"").slice(0,7) === ym, end = ym + "-31";
  const invs = S.invoices.filter(i => inM(i.date));
  const st = {count:invs.length, purchases:0, gross:0, invDisc:0, lineDisc:0, bonus:0, paid:0, payDisc:0, credits:0, cold:0};
  for (const i of invs){ const c = calc(i); st.purchases += c.dueAmt; st.gross += c.gross; st.invDisc += c.invDisc; st.lineDisc += c.lineDisc; st.bonus += c.bonusUnits; st.cold += c.cold; }
  for (const p of S.payments.filter(p => p.verified && inM(p.date))){ st.paid += n0(p.amount); st.payDisc += n0(p.discount); }
  st.credits = S.credits.filter(x => x.verified && inM(x.date)).reduce((a,x) => a + n0(x.amount), 0);
  st.saved = st.lineDisc + st.invDisc + st.payDisc;
  st.bySup = S.suppliers.map(s => {
    const owed = (s.openingVerified && !s.openingExcluded ? n0(s.openingBalance) : 0)
      + S.invoices.filter(i => i.supplierId === s.id && i.date <= end).reduce((a,i) => a + calc(i).dueAmt, 0)
      - S.payments.filter(p => p.supplierId === s.id && p.verified && p.date <= end).reduce((a,p) => a + n0(p.amount) + n0(p.discount), 0)
      - S.credits.filter(x => x.supplierId === s.id && x.verified && x.date <= end).reduce((a,x) => a + n0(x.amount), 0);
    const bought = invs.filter(i => i.supplierId === s.id).reduce((a,i) => a + calc(i).dueAmt, 0);
    return {s, owed, bought}; });
  return st;
}
function monthView(){
  const st = monthStats(S.month);
  return `<label>Month<input type="month" id="repMonth" value="${esc(S.month)}" max="${today().slice(0,7)}"></label>
  <section class="kpis">
    <div class="kpi lead"><span class="l">Purchases (after discount)</span><span class="v num">${iqd(st.purchases)}</span><span class="l">${st.count} invoices</span></div>
    <div class="kpi"><span class="l">Discounts gained</span><span class="v num" style="color:var(--good)">${iqd(st.saved)}</span><span class="l num">line ${iqd(st.lineDisc)} · invoice ${iqd(st.invDisc)} · payment ${iqd(st.payDisc)}</span></div>
    <div class="kpi"><span class="l">Free bonus units</span><span class="v num">${st.bonus}</span></div>
    <div class="kpi"><span class="l">Paid to suppliers</span><span class="v num">${iqd(st.paid)}</span><span class="l num">after discount (cash) · before discount ${iqd(st.paid + st.payDisc)}</span></div>
    <div class="kpi"><span class="l">Returns and credits</span><span class="v num">${iqd(st.credits)}</span></div>
  </section>
  <div class="tablewrap"><table><thead><tr><th>Supplier</th><th class="n">Bought this month</th><th class="n">Owed at month end</th></tr></thead><tbody>
  ${st.bySup.map(x => `<tr><td>${esc(x.s.name)}${x.s.openingVerified || !isNum(x.s.openingBalance) ? "" : ` <span class="pill warn">opening not verified</span>`}</td><td class="n num">${iqd(x.bought)}</td><td class="n num">${iqd(x.owed)}</td></tr>`).join("")}
  </tbody></table></div>
  <button type="button" data-act="monthxlsx" ${S.dl ? "" : "disabled"}>Download this month (.xlsx)</button>`;
}
async function exportMonth(btn){
  if (!S.dl || !window.XLSX){ toast("Excel export isn't available here."); return; }
  btn.disabled = true;
  try {
    const st = monthStats(S.month), wb = XLSX.utils.book_new();
    const sheet = (name, rows) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows.length ? rows : [{Note:"No records"}]), name);
    sheet("Summary", [["Month", S.month], ["Invoices", st.count], ["Purchases before discount (IQD)", Math.round(st.gross)], ["Line discounts (IQD)", Math.round(st.lineDisc)], ["Invoice discounts (IQD)", Math.round(st.invDisc)], ["Payment discounts (IQD)", Math.round(st.payDisc)], ["Purchases after discount (IQD)", Math.round(st.purchases)], ["Free bonus units", st.bonus], ["Paid before discount (IQD)", Math.round(st.paid + st.payDisc)], ["Paid after discount - cash (IQD)", Math.round(st.paid)], ["Returns and credits (IQD)", Math.round(st.credits)]].map(([k,v]) => ({Item:k, Value:v})));
    sheet("By Supplier", st.bySup.map(x => ({"Supplier":x.s.name, "Bought This Month (IQD)":Math.round(x.bought), "Owed at Month End (IQD)":Math.round(x.owed), "Opening Verified":x.s.openingVerified ? "Yes" : "No"})));
    sheet("Invoices", S.invoices.filter(i => (i.date||"").startsWith(S.month)).map(i => { const c = calc(i); return {"Supplier":supName(i.supplierId), "Invoice No.":i.invoiceNo, "Date":i.date, "Amount Due (IQD)":Math.round(c.dueAmt), "Discount (IQD)":Math.round(c.discount), "Outstanding (IQD)":Math.round(c.outstanding), "Status":i.status}; }));
    sheet("Payments", S.payments.filter(p => (p.date||"").startsWith(S.month)).map(p => ({"Supplier":supName(p.supplierId), "Date":p.date, "Amount (IQD)":p.amount, "Discount (IQD)":n0(p.discount), "Verified":p.verified ? "Yes" : "No"})));
    await S.dl.save({filename:`Raihana_Monthly_Report_${S.month}.xlsx`, data:new Blob([XLSX.write(wb, {bookType:"xlsx", type:"array"})])});
    toast("Monthly report saved.");
  } catch(e){ toast(e?.code === "declined" ? "Download cancelled." : "Export failed. Try again."); }
  finally { btn.disabled = false; }
}

function statementList(){
  return `<p class="note">Compare what a supplier says you owe with your records. Pick a supplier.</p><div class="list">${S.suppliers.map(s => { const last = (s.statements||[]).slice(-1)[0];

/* ---- export: extra sheets ---- */
function extraSheets(add){
  add("Returns and Credits", (S.allCredits||[]).map(x => ({"ID":x.id, "Supplier":supName(x.supplierId), "Invoice No.":S.invoices.find(i => i.id === x.invoiceId)?.invoiceNo || "", "Date":x.date, "Type":x.type, "Reason":x.reason, "Amount (IQD)":x.amount, "Credit Note No.":x.ref||"", "Confirmed":x.verified ? "Yes" : "No", "Cancelled":x.voided ? "Yes (not counted)" : "", "Items":x.items||"", "Recorded By":whoName(x.createdBy)})));
  const rec = []; for (const i of S.invoices) if (i.receivedLines) (i.lines||[]).forEach((l,k) => { const r = i.receivedLines[k]; if (r) rec.push({"Supplier":supName(i.supplierId), "Invoice No.":i.invoiceNo, "Product":l.desc, "Expected (paid + bonus)":n0(l.qty) + n0(l.bonus), "Received":r.qty, "Problem":r.issue, "Checked By":whoName(i.checkedBy)}); });
  add("Receiving", rec);
  add("Price Changes", priceChanges().map(x => ({"Product":x.l.desc, "Supplier":supName(x.inv.supplierId), "Invoice No.":x.inv.invoiceNo, "Date":x.inv.date, "Previous Unit Price (IQD)":Math.round(x.before), "New Unit Price (IQD)":Math.round(x.now), "Change %":Math.round(x.pct * 1000) / 10, "Previous Invoice":x.prevInv.invoiceNo})));
  add("Expiring Items", expiringItems(12).map(x => ({"Product":x.l.desc, "Expiry":x.l.expiry, "Months Left":monthsLeft(x.l.expiry), "Quantity":n0(x.l.qty) + n0(x.l.bonus), "Batch":x.l.batch||"", "Supplier":x.supplier, "Invoice No.":x.inv.invoiceNo, "Return By":calc(x.inv).returnBy||""})));
  const ch = []; for (const i of S.invoices) (i.history||[]).forEach(h => ch.push({"Record":"Invoice " + i.invoiceNo, "When":h.at.slice(0,16).replace("T"," "), "Who":whoName(h.by), "Reason":h.reason, "Changes":h.changes.filter(c => c.field !== "Line details").map(c => `${c.field}: ${c.from} → ${c.to}`).join("; ")}));
  for (const p of (S.allPayments||[])) (p.history||[]).forEach(h => ch.push({"Record":"Payment " + p.id, "When":h.at.slice(0,16).replace("T"," "), "Who":whoName(h.by), "Reason":h.reason, "Changes":h.changes.map(c => `${c.field}: ${c.from} → ${c.to}`).join("; ")}));
  add("Change History", ch);
}

document.addEventListener("click", ev => {
  const t = ev.target.closest("button"); if (!t) return;
  if (t.id === "langBtn"){ setLang(S.lang === "ar" ? "en" : "ar"); return; }
  if (t.dataset.goreport){ S.tab = "reports"; S.rep = t.dataset.goreport; lsSet("rp.rep", S.rep); render(); window.scrollTo(0,0); return; }
  if (t.dataset.rep){ S.rep = t.dataset.rep; lsSet("rp.rep", S.rep); render(); return; }
  if (t.dataset.payscope){ S.payScope = t.dataset.payscope; render(); return; }
  if (t.dataset.paysort){ S.paySort = t.dataset.paysort; render(); return; }
  if (t.dataset.expm !== undefined){ S.expMonths = +t.dataset.expm; render(); return; }
  if (t.dataset.act === "monthxlsx") return exportMonth(t);
  if (t.dataset.newcredit !== undefined){ const inv = S.invoices.find(i => i.id === t.dataset.newcredit); return creditForm(inv ? {supplierId:inv.supplierId, invoiceId:inv.id} : {}); }
  if (t.dataset.credit) return creditDetail(t.dataset.credit);
  if (t.dataset.crver){ const x = S.allCredits.find(c => c.id === t.dataset.crver); write("credits/" + x.id, {verified:!x.verified}, true).then(() => { toast("Updated."); creditDetail(x.id); }).catch(e => $("#crDetErr").textContent = e.message); return; }
  if (t.dataset.crvoid){ if (t.dataset.armed !== "1"){ t.dataset.armed = "1"; t.textContent = "Tap again to cancel it"; return; }
    write("credits/" + t.dataset.crvoid, {voided:true, voidedAt:new Date().toISOString()}, true).then(() => { closeSheet(); toast("Return cancelled. It stays in the records."); }).catch(e => $("#crDetErr").textContent = e.message); return; }
  if (t.dataset.retline){ const [id, k] = t.dataset.retline.split(":"); const i = S.invoices.find(x => x.id === id), l = i?.lines?.[+k]; if (!i) return;
    const qty = n0(l?.qty) + n0(l?.bonus), unit = l && n0(l.qty) ? lineNet(l) * invFactor(i) / n0(l.qty) : 0;
    return creditForm({supplierId:i.supplierId, invoiceId:i.id, type:"Return of goods", reason:"Expired or short expiry", pick:{[+k]:Math.max(0, qty - returnedQty(i.id, +k))}, items:l ? `${l.desc} × ${qty}${l.batch ? ` (batch ${l.batch})` : ""}, expiry ${l.expiry}` : "", source:"expiry"}); }
  if (t.dataset.recvlines) return recvSheet(t.dataset.recvlines);
  if (t.dataset.cqp !== undefined) return crSetQty(t.dataset.cqp, n0(S.crPick[t.dataset.cqp]) + 1);
  if (t.dataset.cqm !== undefined) return crSetQty(t.dataset.cqm, n0(S.crPick[t.dataset.cqm]) - 1);
  if (t.dataset.stmt) return statementSheet(t.dataset.stmt);
  if (t.dataset.stfill){ const i = S.invoices.find(x => x.id === t.dataset.stfill); const amt = +t.dataset.amt; $("#stAmt").value = amt; $("#stDate").value = i.date; S.stmt.amount = amt; S.stmt.date = i.date; return stmtRefresh(); }
  if (t.dataset.stverify){ const s = supplier(t.dataset.stverify); write("suppliers/" + s.id, {openingVerified:true, openingDate:s.openingDate || S.stmt.date}, true).then(() => { toast("Opening balance verified. It now counts in what you owe."); stmtRefresh(); }).catch(e => toast(e.message)); return; }
  if (t.dataset.stsave){ const s = supplier(S.stmt.sid); write("suppliers/" + s.id, {statements:[...(s.statements||[]), {date:S.stmt.date, theirs:S.stmt.amount, mine:Math.round(S.stmt.mine), diff:Math.round(S.stmt.diff), at:new Date().toISOString(), by:S.meId}]}, true).then(() => { toast("Check saved."); setTimeout(stmtRefresh, 300); }).catch(e => toast(e.message)); return; }
});
document.addEventListener("change", ev => {
  const t = ev.target;
  if (t.dataset?.plan){ S.plan[t.dataset.plan] = t.checked; lsSet("rp.plan", S.plan); render(); return; }
  if (t.dataset?.stk){ t.checked ? S.stmt.off.delete(t.dataset.stk) : S.stmt.off.add(t.dataset.stk); stmtRefresh(); return; }
  if (t.id === "repMonth" && t.value){ S.month = t.value; render(); return; }
  if (t.id === "cSup"){ const sid = t.value; $("#cInv").innerHTML = `<option value="">Not linked to one invoice</option>` + S.invoices.filter(i => i.supplierId === sid).map(i => `<option value="${esc(i.id)}">${esc(i.invoiceNo)} · ${esc(i.date)}</option>`).join(""); S.crPick = {}; crPicker(); return; }
  if (t.id === "cInv"){ S.crPick = {}; S.crQ = ""; crPicker(); crPickApply(); return; }
  if (t.dataset?.cq !== undefined){ crSetQty(t.dataset.cq, parseNum(t.value)); return; }
  if (t.closest?.("#rcForm")) rcSum();
});
document.addEventListener("input", ev => {
  const t = ev.target;
  if (t.id === "stAmt"){ S.stmt.amount = parseNum(t.value); stmtRefresh(); }
  if (t.id === "cAmt") S.crAmtTouched = t.value.trim() !== "";
  if (t.id === "cQ"){ S.crQ = t.value; crPicker(); const q = $("#cQ"); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  if (t.id === "stDate" && t.value){ S.stmt.date = t.value; stmtRefresh(); }
  if (t.closest?.("#rcForm")) rcSum();
});
document.addEventListener("submit", ev => {
  if (ev.target.id === "crForm") return saveCredit(ev);

});

function cartPay(total){
  const m = S.cartMeta.method;
  if (m === "debt" && debtOn()) return {method:"debt", card:0, cash:0, over:false};
  const typed = wIQD(n0(S.cartMeta.card)), card = m === "card" ? total : Math.max(0, Math.min(total, typed));
  return {method: total > 0 && card >= total ? "card" : card > 0 ? "split" : "cash", card, cash:total - card, over: m !== "card" && typed > total};
}

function finderHits(q){

  if (canUse("stock") || canUse("sell")) out.push(...take(catalog().filter(p => (p.barcode && String(p.barcode) === raw) || has(p.name, p.strength, p.form, p.sci))).map(p =>
    ({kind:"Medicine", t:pname(p), s:[p.strength, p.form, p.barcode].filter(Boolean).join(" · "), attr: canUse("stock") ? `data-xprod="${esc(p.id)}"` : `data-xfindsell="${esc(p.name)}"`})));
  if (canUse("customers")) out.push(...take(E.customers.filter(c => !c.deleted && (has(c.name) || (c.phone && String(c.phone).replace(/\D/g, "").includes(raw.replace(/\D/g, "") || "-"))))).map(c => ({kind:"Customer", t:c.name, s:c.phone || "", attr:`data-xcust="${esc(c.id)}"`})));
  if (canUse("chronic")) out.push(...take(E.chronic.filter(c => !c.deleted && has(c.name))).map(c => ({kind:"Chronic card", t:c.name, s:c.phone || "", attr:`data-xfindgo="chronic"`})));
  if (canUse("suppliers")) out.push(...take(S.suppliers.filter(x => has(x.name, x.nameAr || ""))).map(x => ({kind:"Supplier", t:x.name, s:x.nameAr || "", attr:`data-open="sup:${esc(x.id)}"`})));
  if (canUse("invoices")) out.push(...take(S.invoices.filter(i => String(i.invoiceNo || "").toLowerCase().includes(raw.toLowerCase()))).map(i => ({kind:"Invoice", t:`${supName(i.supplierId)} · ${i.invoiceNo}`, s:i.date || "", attr:`data-open="${esc(i.id)}"`})));
  if (canUse("sell")) out.push(...take(E.sales.filter(x => String(x.no || "").toLowerCase().includes(raw.toLowerCase())).sort((a, b) => String(b.at).localeCompare(String(a.at)))).map(x => ({kind:"Receipt", t:x.no, s:`${x.date} · ${iqd(x.total)}${x.voided ? " · Cancelled" : ""}`, attr:`data-xsale="${esc(x.id)}"`})));
  return out;
}

    return {p, u, good, sd:u.sold30, boxes, sup, out: good <= 0}; }).sort((a, b) => a.sup.localeCompare(b.sup) || b.out - a.out || b.u.fast - a.u.fast || pname(a.p).localeCompare(pname(b.p)));
}

const NEAR_MONTHS = 3;

  for (const p of catalog()) for (const b of stockOf(p, used).bs) if (b.left > 1e-6 && !b.expired && b.ml !== null && b.ml <= NEAR_MONTHS) out.push({p, b});
  return out.sort((a, b) => a.b.expiry.localeCompare(b.b.expiry) || pname(a.p).localeCompare(pname(b.p))); }

/* phone notifications, free and with nothing to set up: the installed app asks once for permission, then sends the day's

const canNotify = () => window.ERP_MODE === "device" && "Notification" in window && "serviceWorker" in navigator;
const notifyAsk = () => canNotify() && Notification.permission === "default" ? `<div class="sum" style="gap:6px"><span>Get this list as a notification on this phone every day.</span><button type="button" data-xnotify="1">Turn on phone notifications</button></div>` : "";

function phoneParts(whole){
  const ne = whole || canUse("sell") || isOwner() ? nearExpiry() : [], rows = whole || seesShortage() ? reorderRows() : [], out = rows.filter(r => r.out).length;
  return {short: rows.length ? `${rows.length} to order${out ? ` (${out} out of stock)` : ""}: ${rows.slice(0, 6).map(r => `${pname(r.p)} x ${r.boxes}`).join(", ")}${rows.length > 6 ? "…" : ""}` : "",
    near: ne.length ? `${ne.length} batch${ne.length === 1 ? "" : "es"} to sell first: ${ne.slice(0, 4).map(x => `${pname(x.p)} ${x.b.expiry}`).join(", ")}${ne.length > 4 ? "…" : ""}` : ""};

async function dailyPhoneNote(){

  if (Notification.permission !== "granted") return;
  try { const r = await navigator.serviceWorker.ready;
    if (r.periodicSync){ const st = await navigator.permissions.query({name:"periodic-background-sync"}).catch(() => null); if (st?.state === "granted") await r.periodicSync.register("raihana-daily", {minInterval:864e5}); }
    if (note && lsGet("erp.noteDay", "") !== today()){ lsSet("erp.noteDay", today()); await r.showNotification(note.title, {body:note.body, tag:"raihana-daily", icon:"icon-192.png"}); }
  } catch(e){ /* a notification problem never stops the app */ }
}

/* ---- same medicine, other brand (owner's rule, 23 Oct 2026): when another item has the same scientific name, dose and
   form and its stock expires sooner (or this one is out), the till offers it first. The cashier keeps the brand picked
   when the customer asked for it by name. Within one item the till already sells the nearest expiry batch first ---- */
const sciKey = p => String(p.sci || "").toLowerCase().split(/\s*(?:[+\/,&،]|\band\b|\bwith\b)\s*/).map(x => x.replace(/[^\p{L}\p{N}]+/gu, "")).filter(Boolean).sort().join("+");
const doseKey = p => String(p.strength || "").toLowerCase().replace(/\s+/g, "").replace(/,/g, ".");
function soonerSame(p){
  const k = sciKey(p), dk = doseKey(p); if (!k || !dk) return null;
  const used = usedMap(), mine = stockOf(p, used).next, fk = String(p.form || "").toLowerCase().trim(); let best = null;
  for (const q of catalog()){ if (q.id === p.id || sciKey(q) !== k || doseKey(q) !== dk || String(q.form || "").toLowerCase().trim() !== fk) continue;
    const n = stockOf(q, used).next; if (!n || !n.expiry) continue;
    if (mine && n.expiry >= (mine.expiry || "9999")) continue;

/* ---- morning notification from the cloud (Supabase), also when the app is closed and on iPhone. The phone registers

const pushFn = () => { const c = window.ERP_SYNC?.cfg?.(); return c ? {url:c.url + "/functions/v1/daily-stock-push", h:{apikey:c.anon, Authorization:"Bearer " + c.anon, "Content-Type":"application/json"}} : null; };

<script>
// motion: enter animations on tab change, count-up totals, ripple, tick on success toasts (no data changes)
(function(){
  const calm = () => window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const fmt = n => Math.round(n).toLocaleString("en-US");
  function countUp(root){
    return; // ERP: totals show their real value straight away
    root.querySelectorAll(".kpi .v.num, .sum .r.big .num").forEach(el => {
      const m = /^(−?)([\d,]+)(.*)$/.exec(el.textContent.trim()); if (!m) return;
      const to = +m[2].replace(/,/g, ""); if (!to || to < 10) return;
      const t0 = performance.now(), dur = 600;
      const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        el.textContent = m[1] + fmt(to * e) + m[3]; if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
  function stagger(root, sel){ root.querySelectorAll(sel).forEach((el, k) => el.style.setProperty("--i", Math.min(k, 12))); }
  let lastKey = null;
  const baseRender = window.render;
  window.render = render = function(){
    const r = baseRender.apply(this, arguments);
    const key = S.ready ? [S.tab, S.filter, S.rep, S.supOpen].join("|") : null;
    if (key && key !== lastKey){
      const v = document.getElementById("view");
      v.classList.remove("enter"); void v.offsetWidth; v.classList.add("enter");
      stagger(v, ".kpi"); v.querySelectorAll(".list").forEach(l => stagger(l, ":scope > *"));
      countUp(v); lastKey = key;
    }
    return r;
  };
  const baseOpen = window.openSheet;
  window.openSheet = openSheet = function(){
    const r = baseOpen.apply(this, arguments);
    const pb = document.getElementById("sheetBody"); stagger(pb, ":scope > *"); countUp(pb);
    return r;
  };
  const baseToast = window.toast;
  window.toast = toast = function(msg){
    baseToast.apply(this, arguments);
    const t = document.getElementById("toast");
    if (/saved|approved|paid|updated|recorded|done|تم/i.test(msg) && !/cancel|fail|error|not /i.test(msg)){
      t.innerHTML = `<span class="tick" aria-hidden="true">✓</span>`; t.append(document.createTextNode(msg));
    }
    t.style.animation = "none"; void t.offsetWidth; t.style.animation = "";
  };
  document.addEventListener("pointerdown", e => {
    if (calm()) return;
    const b = e.target.closest("button.primary, .kpi.tap, nav.tabs button, .pd button, button.row"); if (!b || b.disabled) return;
    if (getComputedStyle(b).position === "static") b.style.position = "relative";
    b.style.overflow = "hidden";
    const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), s = document.createElement("span");
    s.className = "ripple"; s.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d/2}px;top:${e.clientY - r.top - d/2}px`;
    b.appendChild(s); setTimeout(() => s.remove(), 550);
  }, {passive:true});
})();
</script>
